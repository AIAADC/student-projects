<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">网页上传项目流程</title>
  <desc id="desc">Fork、创建文件、填写项目说明、提交变更、发起 Pull Request</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2328" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="80" y="82" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#1f2328">网页上传项目：5 步完成</text>
  <text x="82" y="125" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" fill="#57606a">不会 Git 也没关系，照着按钮走，就能把自己的项目分享给大家。</text>

  <g filter="url(#shadow)">
    <rect x="80" y="190" width="230" height="245" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="125" cy="235" r="27" fill="#0969da"/><text x="125" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">1</text>
    <text x="165" y="242" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1f2328">Fork</text>
    <rect x="108" y="280" width="174" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="195" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="18" fill="#24292f">Fork</text>
    <text x="108" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">打开仓库后，</text>
    <text x="108" y="385" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">先复制到自己的账号。</text>
  </g>

  <path d="M325 310 L365 310" stroke="#0969da" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="380" y="190" width="230" height="245" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="425" cy="235" r="27" fill="#0969da"/><text x="425" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">2</text>
    <text x="465" y="242" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1f2328">Add file</text>
    <rect x="408" y="280" width="174" height="42" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="495" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#24292f">Add file ▾</text>
    <text x="408" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">点击 Add file，</text>
    <text x="408" y="385" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">选择 Create new file。</text>
  </g>

  <path d="M625 310 L665 310" stroke="#0969da" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="680" y="190" width="230" height="245" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="725" cy="235" r="27" fill="#0969da"/><text x="725" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">3</text>
    <text x="765" y="242" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1f2328">写项目说明</text>
    <rect x="708" y="280" width="174" height="42" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="795" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="16" fill="#6e4b00">projects/name/README.md</text>
    <text x="708" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">复制 README 模板，</text>
    <text x="708" y="385" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">替换项目名称和内容。</text>
  </g>

  <path d="M925 310 L965 310" stroke="#0969da" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="980" y="190" width="230" height="245" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="1025" cy="235" r="27" fill="#0969da"/><text x="1025" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">4</text>
    <text x="1065" y="242" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#1f2328">Commit</text>
    <rect x="1008" y="280" width="174" height="42" rx="8" fill="#1f883d"/>
    <text x="1095" y="307" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" fill="#fff">Commit changes</text>
    <text x="1008" y="355" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">填写一句提交说明，</text>
    <text x="1008" y="385" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">保存你的修改。</text>
  </g>

  <path d="M1100 470 C1100 555 700 555 700 610" fill="none" stroke="#0969da" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="485" y="625" width="430" height="185" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <circle cx="535" cy="680" r="27" fill="#8250df"/><text x="535" y="689" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#fff">5</text>
    <text x="580" y="687" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700" fill="#1f2328">Open pull request</text>
    <text x="535" y="735" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" fill="#57606a">点击 Contribute → Open pull request，</text>
    <text x="535" y="770" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" fill="#57606a">简单介绍项目，然后提交即可。</text>
  </g>

  <text x="80" y="865" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#57606a">提示：项目不需要完美，先把 README 写清楚，再慢慢迭代。</text>
</svg>